<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <style>
        .counter-container {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, sans-serif;
        }

        .count-box {
            width: 120px;
            height: 120px;
            background-color: aqua;
            border: 2px solid #00cccc;
            line-height: 120px;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
        }

        .btn {
            background-color: #e0f7fa;
            border: 1px solid #b2ebf2;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <div id="count-box" class="count-box">0</div>

        <button type="button" onclick="addCount()" class="btn">Add</button>
        <button type="button" onclick="subtractCount()" class="btn">Subtract</button>
        <button type="button" onclick="multiplyCount()" class="btn">Multiply</button>
        <button type="button" onclick="divideCount()" class="btn">Divide</button>
    </div>

    <script>
        let count = 0;

        function updateDisplay() {
            document.getElementById('count-box').innerText = count;
        }

        function addCount() {
            count = count + 5;
            updateDisplay();
        }

        function subtractCount() {
            count = count - 5;
            updateDisplay();
        }

        function multiplyCount() {
            count = count * 10;
            updateDisplay();
        }

        function divideCount() {
            count = count / 5;
            if (count % 1 !== 0) {
                count = parseFloat(count.toFixed(2));
            }
            updateDisplay();
        }
    </script>

</body>
</html>
