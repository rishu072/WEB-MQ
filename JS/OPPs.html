       class ATM {
            constructor(cardHolder, balance, pin) {
                this.cardHolder = cardHolder;
                this.balance = balance;
                this.pin = pin;
            }

            checkBalance() {
                console.log(`Balance: $${this.balance}`);
            }

            deposit(amount) {
                this.balance += amount;
                console.log(`Deposited: $${amount}. New balance: $${this.balance}`);
            }

            withdraw(amount) {
                this.balance -= amount;
                console.log(`Withdrew: $${amount}. Remaining: $${this.balance}`);
            }
        }

        let myATM = new ATM("rishu", 1000, 1234);
        myATM.checkBalance();
        myATM.deposit(500);
        myATM.withdraw(200);
