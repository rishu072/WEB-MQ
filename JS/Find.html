// All employees name of IT Department.
    function printITEmployees() {
        const itDept = departments.find(dept => dept.Dname === "IT");
        if (itDept) {
            const itEmployees = [...employees, ...junior_employees]
                .filter(emp => emp.department === itDept.Dcode)
                .map(emp => emp.name);
            console.log("All IT Employees:", itEmployees);
        }
    }

    //print all the senoirs and thier respective junior names.
    function printSeniorsAndJuniors() {
        employees.forEach(senior => {
            const juniorNames = senior.junior_assigned.map(juniorId => {
                const junior = junior_employees.find(je => je.employee_id === juniorId);
                return junior ? junior.name : juniorId;
            });
            console.log(`Senior: ${senior.name} -> Juniors: ${juniorNames.join(", ")}`);
        });
    }

    // print the most condtly iteam in the cart of it juniors.
    function printMostCostlyItJuniorItem() {
        const itDept = departments.find(dept => dept.Dname === "IT");
        if (itDept) {
            const itJuniors = junior_employees.filter(je => je.department === itDept.Dcode);
            const allItems = itJuniors.flatMap(je => je.products_in_cart || []);
            const mostCostly = allItems.reduce((max, item) => (item.cost > (max?.cost || 0)) ? item : max, null);
            console.log("Most costly item in the cart of IT juniors:", mostCostly);
        }
    }

    //print the total salarys going to each department.
    function printTotalSalariesByDepartment() {
        departments.forEach(dept => {
            const totalSenior = employees.filter(emp => emp.department === dept.Dcode).reduce((sum, emp) => sum + emp.salary, 0);
            const totalJunior = junior_employees.filter(emp => emp.department === dept.Dcode).reduce((sum, emp) => sum + emp.salary, 0);
            console.log(`Department ${dept.Dname}: Total Salary = ${totalSenior + totalJunior} (Senior: ${totalSenior}, Junior: ${totalJunior})`);
        });
    }

    //Make it catagory arrays.
    function printUniqueInterestCategories() {
        const allCategories = [...employees, ...junior_employees].flatMap(emp => 
            (emp.interests || []).flatMap(interestObj => Object.keys(interestObj))
        );
        const uniqueCategories = [...new Set(allCategories)];
        console.log("All Unique Interest Categories:", uniqueCategories);
    }
