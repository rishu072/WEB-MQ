<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Colour Changer</title>
</head>
<body>

    <!-- Using class instead of ID because IDs must be unique in HTML -->
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>

    <!-- Added type="button" to avoid missing type attribute warnings -->
    <button type="button" onclick="changeToRed()">Red</button>
    <button type="button" onclick="changeToBlue()">Blue</button>
    <button type="button" onclick="changeToGreen()">Green</button>

    <script>
        // We use querySelectorAll to select all elements with the class 'my-heading'
        // and loop through them using .forEach() to change their colors.
        function changeToRed() {
            const headings = document.querySelectorAll(".my-heading");
            headings.forEach(heading => {
                heading.style.color = "red";
            });
        }

        function changeToBlue() {
            const headings = document.querySelectorAll(".my-heading");
            headings.forEach(heading => {
                heading.style.color = "blue";
            });
        }

        function changeToGreen() {
            const headings = document.querySelectorAll(".my-heading");
            headings.forEach(heading => {
                heading.style.color = "green";
            });
        }
    </script>

</body>
</html>
