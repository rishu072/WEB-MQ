<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Colour Changer</title>
</head>
<body>

    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>
    <h1 class="my-heading">RISHU</h1>

    <button type="button" onclick="changeColor()">click me!</button>

    <script>
        const colors = ["red", "blue", "green"];
        let colorIndex = 0;

        function changeColor() {
            const headings = document.querySelectorAll(".my-heading");
            headings.forEach(heading => {
                heading.style.color = colors[colorIndex];
            });
            colorIndex = (colorIndex + 1) % colors.length;
        }
    </script>

</body>
</html>
