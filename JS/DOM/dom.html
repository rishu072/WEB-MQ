<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>rishu</h1>
    <script>
        let str = "RISHU";

        let revBuiltIn = str.split("").reverse().join("");
        console.log("Built-in reverse:", revBuiltIn);

        function customReverse(input) {
            let arr = typeof input === "string" ? input.split("") : [...input];
            let left = 0;
            let right = arr.length - 1;

            while (left < right) {
                let temp = arr[left];
                arr[left] = arr[right];
                arr[right] = temp;
                left++;
                right--;
            }
            return typeof input === "string" ? arr.join("") : arr;
        }

        console.log("Custom reverse (string):", customReverse(str));
        console.log("Custom reverse (array):", customReverse([1, 2, 3, 4, 5]));

        function isPalindromeSimple(str) {
            let reversed = str.split("").reverse().join("");
            return str === reversed;
        }

        function isPalindromeLoop(str) {
            let left = 0;
            let right = str.length - 1;

            while (left < right) {
                if (str[left] !== str[right]) {
                    return false;
                }
                left++;
                right--;
            }
            return true;
        }

        console.log("--- Palindrome Tests ---");
        console.log("isPalindromeSimple('racecar'):", isPalindromeSimple("racecar"));
        console.log("isPalindromeSimple('hello'):", isPalindromeSimple("hello"));     
        console.log("isPalindromeLoop('madam'):", isPalindromeLoop("madam"));         
        console.log("isPalindromeLoop('Rishu'):", isPalindromeLoop("Rishu"));         
    </script>
</body>
</html>
