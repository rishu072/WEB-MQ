<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Js Arrays Function</h1>
    <script>
       
        let classroom = [
            ["Rahul","Aman","Mohit"],
            ["Neha","Riya","Pooja"],
            ["Karan","Ajay","Ravi"]
        ];

        // Print first row elements
        console.log("First Row:");
        console.log(classroom[0]);
        console.log(classroom[1]);
        console.log(classroom[2]);

        // Print rows in reverse (in array form)
        console.log("First Row Reversed:", [...classroom[0]].reverse());
        console.log("Second Row Reversed:", [...classroom[1]].reverse());
        console.log("Third Row Reversed:", [...classroom[2]].reverse());

        // Print diagonal (in array form)
        console.log("Diagonal:", classroom.map((row, i) => row[i]));
    </script>
</body>
</html>
