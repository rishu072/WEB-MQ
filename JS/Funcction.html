<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Js Arrays Function</h1>
    <script>
       
        let classroom = [
            ["Rahul","Aman","Mohit"],
            ["Neha","Riya","Pooja"],
            ["Karan","Ajay","Ravi"]
        ];

        // Print first row elements
        console.log("First Row:");
        console.log(classroom[0][0]);
        console.log(classroom[0][1]);
        console.log(classroom[0][2]);

        // Print first row in reverse
        console.log("First Row Reversed:");
        for (let j = classroom[0].length - 1; j >= 0; j--) {
            console.log(classroom[0][j]);
        }
        console.log("Second Row Reversed:");
        for (let j = classroom[0].length - 1; j >= 0; j--) {
            console.log(classroom[1][j]);
        }
        console.log("Third Row Reversed:");
        for (let j = classroom[0].length - 1; j >= 0; j--) {
            console.log(classroom[2][j]);
        }

        // Print diagonal
        console.log("Diagonal:");
        for (let i = 0; i < classroom.length; i++) {
            console.log(classroom[i][i]);
        }
    </script>
</body>
</html>
