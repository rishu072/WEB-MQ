<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Js Arrays Function</h1>
    <script>
       
        let classroom = [
            ["Rahul","Aman","Mohit"],
            ["Neha","Riya","Pooja"],
            ["Karan","Ajay","Ravi"]
        ];

        // Print first row
        console.log("First Row:", classroom[0]);

        // Print diagonal
        console.log("Diagonal:");
        for (let i = 0; i < classroom.length; i++) {
            console.log(classroom[i][i]);
        }
    </script>
</body>
</html>
